            animation:'shimmerSweep 1.4s ease-out .5s both',
            pointerEvents:'none',
          }}/>
        </div>

        {/* spark particles — burst from coin center (~140px from left, ~50% top) */}
        <div style={{ position:'absolute', top:'42%', left:'22%', width:0, height:0 }}>
          {SPARKS.map((s, i) => (
            <div key={i} style={{
              position:'absolute', width:7, height:7, borderRadius:'50%',
              background: i % 2 === 0 ? 'rgba(0,0,0,.22)' : 'rgba(255,255,255,.7)',

              '--tx': s.tx, '--ty': s.ty,
              animation:`sparkBurst .9s ease-out ${s.delay} both`,
              opacity: 0,
            }}/>
          ))}
        </div>

        {/* balance */}
        <div style={{ position:'absolute', bottom:'11%', left:0, right:0, textAlign:'center' }}>

          <div>
            <div style={{ color:'rgba(255,255,255,.4)', fontSize:13.5, letterSpacing:3, marginBottom:7, fontFamily:'monospace' }}>· · · ·  · · · ·  · · · ·  4211</div>
            <div style={{ color:'rgba(255,255,255,.55)', fontSize:10, letterSpacing:2.5, textTransform:'uppercase' }}>SpotOn Pay</div>
          </div>
        </div>
      </div>
      <div style={{ padding:'0 24px 52px' }}>
        <button onClick={() => setPage(2)} style={{ width:'100%', background:'#000', color:'#fff', border:'none', borderRadius:50, padding:'18px', fontWeight:600, fontSize:16, cursor:'pointer', letterSpacing:.2 }}>
          + Add payment method
        </button>
      </div>
    </div>
  );

  /* ── Page 2: Payment methods ── */
  return (
    <div className="slide-up" style={{ ...base, background:'#f2f2f2' }}>
      <div style={{ display:'flex', alignItems:'center', padding:'52px 20px 20px' }}>
        <button onClick={() => setPage(1)} style={{ width:34, height:34, borderRadius:'50%', background:'rgba(0,0,0,.08)', border:'none', cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center' }}>
          <Icon name="arrow-left" size={16} color="#000"/>
        </button>
        <div style={{ flex:1, textAlign:'center', marginRight:34, fontWeight:700, fontSize:17, color:'#000' }}>Payment</div>
      </div>
      <div style={{ flex:1, padding:'8px 20px 0', overflowY:'auto' }}>
        {/* payment methods */}
        <div style={{ fontSize:15, fontWeight:700, color:'#000', marginBottom:10 }}>Payment methods</div>
        <div style={{ background:'#fff', borderRadius:14, overflow:'hidden', marginBottom:24 }}>
          <div style={{ display:'flex', alignItems:'center', gap:12, padding:'14px 16px' }}>
            <div style={{ width:40, height:26, background:'#1a1f71', borderRadius:5, display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 }}>
              <span style={{ color:'#fff', fontWeight:900, fontSize:11, fontStyle:'italic', letterSpacing:-.5 }}>VISA</span>
            </div>
            <div style={{ flex:1, fontSize:15, color:'#000', fontWeight:500 }}>· · · ·  4211</div>
            <Icon name="check" size={16} color="#000"/>
          </div>
          <div style={{ height:.5, background:'#e8e8e8', margin:'0 16px' }}/>
          <div style={{ display:'flex', alignItems:'center', gap:12, padding:'14px 16px', cursor:'pointer' }}>
            <div style={{ width:40, height:26, background:'#f0f0f0', borderRadius:5, display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 }}>
              <Icon name="card" size={14} color="#666"/>
            </div>
            <div style={{ flex:1, fontSize:15, color:'#000' }}>Add debit or credit card</div>
            <Icon name="chevron-right" size={16} color="#bbb"/>
          </div>
        </div>
        {/* gift cards */}
        <div style={{ fontSize:15, fontWeight:700, color:'#000', marginBottom:10 }}>Gift cards</div>
        <div style={{ background:'#fff', borderRadius:14, overflow:'hidden', marginBottom:24 }}>
          <div style={{ display:'flex', alignItems:'center', gap:12, padding:'14px 16px', cursor:'pointer' }}>
            <div style={{ width:40, height:26, background:'linear-gradient(135deg, #f5c842, #e89c20)', borderRadius:5, display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 }}>
              <Icon name="gift" size={13} color="#fff"/>
            </div>
            <div style={{ flex:1, fontSize:15, color:'#000' }}>Add a gift card</div>
            <Icon name="chevron-right" size={16} color="#bbb"/>
          </div>
        </div>
      </div>
      <div style={{ padding:'12px 24px 52px' }}>
        <button onClick={onClose} style={{ width:'100%', background:'#000', color:'#fff', border:'none', borderRadius:50, padding:'17px', fontWeight:600, fontSize:16, cursor:'pointer' }}>
          Done
        </button>
      </div>
    </div>
  );
}

/* ─── APP ────────────────────────────────────────────────── */

function App() {
  const [onboarded, setOnboarded] = useState(false);
  const [locPerm, setLocPerm] = useState(false);
  const [tab, setTab] = useState('home');
  const [fly, setFly] = useState(USER.fly);
  const [modal, setModal] = useState(null);
  const [data, setData] = useState(null);
  const [prev, setPrev] = useState(null); // { modal, data } — for layered sheets

  const open = (m, d=null) => {
    // Reserve and Order stack on top of a restaurant page
    if ((m === 'reserve' || m === 'order') && modal === 'restaurant') {
      setPrev({ modal, data });
    } else {
      setPrev(null);
    }
    setModal(m);
    setData(d);
  };
  const close = () => {
    if (prev) {
      setModal(prev.modal);
      setData(prev.data);
      setPrev(null);
    } else {
      setModal(null);
      setData(null);
    }
  };

  const handleCheckInSuccess = () => {
    close();
    setTimeout(() => {
      setFly(f => parseFloat((f + 50).toFixed(2)));
      open('newpass');
    }, 300);
  };

  const handlePay = () => open('pay');

  if (!onboarded) return (
    <div style={{ display:'flex', alignItems:'center', justifyContent:'center', width:'100vw', height:'100vh', background:'#000' }}>
      <div style={{
        width: Math.min(390, window.innerWidth),
        height: Math.min(844, window.innerHeight),
        borderRadius: window.innerWidth > 420 ? 48 : 0,
        overflow:'hidden',
        position:'relative',
        boxShadow: window.innerWidth > 420 ? '0 40px 80px rgba(0,0,0,.6), 0 0 0 7px #222, 0 0 0 9px #3a3a3a' : 'none',
      }}>
        <OnboardingScreen
          onDone={() => { setOnboarded(true); setLocPerm(true); }}
          onSignIn={() => setOnboarded(true)}
        />
      </div>
    </div>
  );

  return (
    <div style={{ display:'flex', alignItems:'center', justifyContent:'center', width:'100vw', height:'100vh', background:'#1a1a1a' }}>
      {/* Phone frame */}
      <div style={{
        width: Math.min(390, window.innerWidth),
        height: Math.min(844, window.innerHeight),
        background:'#fff',
        borderRadius: window.innerWidth > 420 ? 48 : 0,
        overflow:'hidden',
        position:'relative',
        boxShadow: window.innerWidth > 420 ? '0 40px 80px rgba(0,0,0,.6), 0 0 0 7px #222, 0 0 0 9px #3a3a3a' : 'none',
        display:'flex',
        flexDirection:'column',
      }}>
        {/* Main screens */}
        {tab === 'home' && (
          <HomeScreen fly={fly} onActivity={() => setTab('profile')} onPassDetail={p => open('pass', p)} onTiers={() => open('tiers')} onBuy={() => open('walletpromo')} onReserve={r => open('restaurant', r)} onConcierge={() => open('concierge')} onSearch={() => open('search')} onReferral={() => open('referral')} onChallenges={() => open('challenges')} onForYou={() => open('foryou')} onFindSpot={() => setTab('map')}/>
        )}
        {tab === 'map' && (
          <ExploreScreen onPassDetail={p => open('pass', p)} onReserve={r => open('restaurant', r)} onSearch={() => open('search')}/>
        )}

        <TabBar tab={tab} onTab={setTab} onCheckin={() => open('checkin')}/>

        {/* Tab screens — rendered above tab bar (z-index 30 > 20) */}
        {tab === 'spot' && (
          <SpotScreen fly={fly} onBuy={() => open('buy')} onMembership={() => setTab('membership')} onReferral={() => open('referral')}/>
        )}

        {/* Floating Pay FAB — z-index 40, above SpotScreen (30) */}
        {tab === 'spot' && (
          <button onClick={handlePay} style={{ position:'absolute', bottom:100, right:20, zIndex:40, background:'#000', color:'#fff', border:'none', borderRadius:50, padding:'13px 22px', display:'flex', alignItems:'center', gap:8, fontWeight:500, fontSize:15, boxShadow:'0 6px 28px rgba(0,0,0,.4)', letterSpacing:.2, fontFamily:'-apple-system,BlinkMacSystemFont,sans-serif', cursor:'pointer' }}>
            <SpotOnIcon size={16} color="#fff"/> Pay
          </button>
        )}
        {tab === 'membership' && (
          <MembershipScreen onTiers={() => open('tiers')} onRedeem={() => open('redeem')}/>
        )}
        {tab === 'profile' && (
          <ProfileScreen fly={fly} onClose={() => setTab('home')} onBuy={() => open('buy')} onWallet={() => setTab('spot')} onRestaurant={r => open('restaurant', r)}/>
        )}

        {/* Sheets */}
        {modal === 'walletpromo' && <WalletPromoSheet onClose={close}/>}
        {modal === 'search'      && <SearchScreen onClose={close} onReserve={r => open('restaurant', r)}/>}
        {modal === 'foryou'      && <ForYouFeed onClose={close} onReserve={r => open('restaurant', r)}/>}
        {modal === 'concierge'   && <ConciergeSheet onClose={close} fly={fly}/>}
        {modal === 'referral'    && <ReferralSheet onClose={close}/>}
        {modal === 'challenges'  && <ChallengesSheet onClose={close}/>}
        {modal === 'tiers'      && <TierSheet onClose={close}/>}
        {modal === 'redeem'     && <RedeemSheet onClose={close}/>}
        {modal === 'buy'        && <BuySheet onClose={close} onSuccess={amt => setFly(f => parseFloat((f + amt).toFixed(2)))}/>}
        {modal === 'checkin'    && <CheckInSheet onClose={close} onSuccess={handleCheckInSuccess}/>}
        {modal === 'pay'        && <PayFlowSheet fly={fly} onClose={close}/>}
        {modal === 'newpass'    && <NewPassSheet onClose={close}/>}
        {modal === 'pass'       && data && <PassSheet pass={data} onClose={close}/>}
        {/* Restaurant page — shown directly or kept alive in background when reserve/order stacks on top */}
        {modal === 'restaurant' && data && <RestaurantSheet restaurant={data} onClose={close} onBuy={() => open('buy')} onOrder={() => open('order', data)} onReserve={() => open('reserve', data)}/>}
        {prev?.modal === 'restaurant' && prev.data && <RestaurantSheet restaurant={prev.data} onClose={close} onBuy={() => open('buy')} onOrder={() => open('order', prev.data)} onReserve={() => open('reserve', prev.data)}/>}
        {/* Reserve / Order layer on top — higher z-index so restaurant shows behind */}
        {modal === 'reserve' && data && <ReservationSheet restaurant={data} onClose={close} sheetZ={prev ? 70 : 50}/>}
        {modal === 'order'   && data && <OrderFlow restaurant={data} onClose={close} fly={fly}/>}

        {/* iOS Location Permission overlay — appears over home screen after onboarding */}
        {locPerm && (
          <div className="fade-in" style={{ position:'absolute', inset:0, background:'rgba(0,0,0,.45)', backdropFilter:'blur(8px)', display:'flex', alignItems:'center', justifyContent:'center', padding:'0 28px', zIndex:200 }}>
            <div style={{ width:'100%', maxWidth:270, background:'rgba(242,242,247,.97)', borderRadius:14, overflow:'hidden', fontFamily:'-apple-system, BlinkMacSystemFont, sans-serif' }}>
              <div style={{ padding:'24px 16px 18px', textAlign:'center' }}>
                <div style={{ width:60, height:60, borderRadius:13, background:'#1063F9', display:'flex', alignItems:'center', justifyContent:'center', margin:'0 auto 14px' }}>
                  <SpotOnIcon size={30} color="#fff"/>
                </div>
                <div style={{ fontSize:17, fontWeight:600, color:'#000', marginBottom:8, lineHeight:1.35 }}>
                  Allow "SpotOn" to use your location?
                </div>
                <div style={{ fontSize:13, color:'rgba(60,60,67,.8)', lineHeight:1.5 }}>
                  Your location is used to show SpotOn restaurants nearby and check you in automatically when you arrive.
                </div>
              </div>
              {[
                { label:'Allow While Using App', color:'#007aff', weight:600 },
                { label:'Allow Once',            color:'#007aff', weight:400 },
                { label:"Don't Allow",           color:'#ff3b30', weight:400 },
              ].map((btn, i) => (
                <React.Fragment key={i}>
                  <div style={{ height:'0.5px', background:'rgba(60,60,67,.29)' }}/>
                  <button onClick={() => setLocPerm(false)} style={{ display:'block', width:'100%', padding:'12px 16px', background:'transparent', border:'none', fontFamily:'-apple-system, BlinkMacSystemFont, sans-serif', fontSize:17, color:btn.color, fontWeight:btn.weight, cursor:'pointer', lineHeight:1.4 }}>
                    {btn.label}
                  </button>
                </React.Fragment>
              ))}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
